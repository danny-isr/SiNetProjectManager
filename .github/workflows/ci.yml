name: CI

on:
  push:
    branches:
      - main
      - master
      - SiWorkNet10
  pull_request:
    branches:
      - main
      - master
      - SiWorkNet10
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SiNet.sln is not self-contained: it reaches sibling repositories that are checked out
      # next to this one. See docs/BUILD_SIBLING_PINS.md. Validate first so a bad pin fails in
      # seconds instead of after a partial restore.
      - name: Validate sibling pins
        shell: pwsh
        run: ./build/fetch-siblings.ps1 -ValidateOnly

      - name: Fetch pinned sibling repositories
        shell: pwsh
        env:
          SIBLING_REPOS_TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN }}
        run: ./build/fetch-siblings.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SiNet.sln

      - name: Build (Debug)
        run: dotnet build SiNet.sln --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build SiNet.sln --configuration Release --no-restore

      - name: Test SiNet.App.Wpf.Tests
        run: dotnet test src/SiNet.App.Wpf.Tests/SiNet.App.Wpf.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test SiNet.Infrastructure.Google.Tests
        run: dotnet test src/SiNet.Infrastructure.Google.Tests/SiNet.Infrastructure.Google.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test SiNet.LegacyBridge.Tests
        run: dotnet test src/SiNet.LegacyBridge.Tests/SiNet.LegacyBridge.Tests.csproj --configuration Release --no-build --verbosity normal

      # Runs last so a secret regression is reported even when the build is green.
      - name: Secret scan
        if: always()
        shell: pwsh
        run: ./build/secret-scan.ps1
